<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>FleetHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        href="fleethub.css"
        rel="stylesheet"
    >

    <!-- Free CSV reader -->
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
</head>

<body class="dashboard-page">
    <main class="app-container">
        <h1 class="title">FleetHub</h1>

        <select id="baseSelector" class="form-select" aria-label="Select base">
            <option value="All Bases">All Bases</option>
            <option value="Canvey">Canvey</option>
            <option value="Chelmsford">Chelmsford</option>
            <option value="Southend">Southend</option>
        </select>

        <div class="section-title">Vehicle checks</div>

        <section class="checks-table">
            <div class="checks-header">
                <div>Check</div>
                <div>Overdue</div>
                <div>Upcoming</div>
            </div>

            <div class="checks-row">
                <div class="check-name">MOT</div>
                <div id="motOverdue" class="count count-overdue">--</div>
                <div id="motUpcoming" class="count count-upcoming">--</div>
            </div>

            <div class="checks-row">
                <div class="check-name">Service</div>
                <div class="placeholder-count">—</div>
                <div class="placeholder-count">—</div>
            </div>

            <div class="checks-row">
                <div class="check-name">Clean</div>
                <div class="placeholder-count">TBC</div>
                <div class="placeholder-count">TBC</div>
            </div>

            <div class="checks-row">
                <div class="check-name">Oxygen</div>
                <div class="placeholder-count">TBC</div>
                <div class="placeholder-count">TBC</div>
            </div>

            <div class="checks-row">
                <div class="check-name">Extinguishers</div>
                <div class="placeholder-count">TBC</div>
                <div class="placeholder-count">TBC</div>
            </div>
        </section>

        <div id="statusMessage" class="status-message">
            Loading fleet data…
        </div>
    </main>

    <script>
        /*
         * Use the current local date for live MOT calculations.
         */
        const UPCOMING_DAYS = 30;

        let vehicles = [];
        let baseLocations = [];
        let motHistory = [];

        function parseDate(value) {
            if (!value) return null;
            const cleanValue=String(value).trim();
            if(!/^\d{4}-\d{2}-\d{2}$/.test(cleanValue)) return null;
            const [year,month,day]=cleanValue.split("-").map(Number);
            const dateValue=new Date(year,month-1,day);
            if(dateValue.getFullYear()!==year||dateValue.getMonth()!==month-1||dateValue.getDate()!==day) return null;
            return dateValue;
        }

        function daysBetween(fromDate, toDate) {
            const millisecondsPerDay = 1000 * 60 * 60 * 24;

            const from = new Date(
                fromDate.getFullYear(),
                fromDate.getMonth(),
                fromDate.getDate()
            );

            const to = new Date(
                toDate.getFullYear(),
                toDate.getMonth(),
                toDate.getDate()
            );

            return Math.round((to - from) / millisecondsPerDay);
        }

        function loadCsv(filename, expectedHeaders) {
            return new Promise((resolve,reject)=>{
                const url=`${filename}${filename.includes("?")?"&":"?"}v=${Date.now()}`;
                Papa.parse(url,{download:true,header:true,skipEmptyLines:"greedy",
                    complete(results){
                        const errors=results.errors||[];
                        if(errors.length){ const details=errors.slice(0,3).map(error=>`row ${Number(error.row??0)+2}: ${error.message}`).join("; "); reject(new Error(`${filename} could not be parsed: ${details}`)); return; }
                        const actual=(results.meta.fields||[]).map(v=>String(v).trim());
                        const missing=expectedHeaders.filter(h=>!actual.includes(h));
                        if(missing.length){ reject(new Error(`${filename} is missing column(s): ${missing.join(", ")}`)); return; }
                        resolve(results.data.map(row=>{ const cleaned={}; actual.forEach(h=>cleaned[h]=String(row[h]??"").trim()); return cleaned; }));
                    },
                    error(error){ reject(new Error(`${filename} could not be downloaded: ${error.message||String(error)}`)); }
                });
            });
        }

        function getLatestRecord(rows, registration, dateField) {
            return rows
                .filter(row =>
                    String(row.Registration).trim() ===
                    String(registration).trim()
                )
                .sort((a, b) => {
                    const dateA = parseDate(a[dateField]);
                    const dateB = parseDate(b[dateField]);

                    const primaryDifference =
                        (dateB || 0) - (dateA || 0);

                    if (primaryDifference !== 0) {
                        return primaryDifference;
                    }

                    const recordedAtA =
                        Date.parse(a.RecordedAt || "") || 0;

                    const recordedAtB =
                        Date.parse(b.RecordedAt || "") || 0;

                    return recordedAtB - recordedAtA;
                })[0] || null;
        }

        function buildCurrentVehicleData() {
            return vehicles
                .filter(vehicle => String(vehicle.Active).trim().toLowerCase() === "yes")
                .map(vehicle => {
                    const baseRecord = getLatestRecord(
                        baseLocations,
                        vehicle.Registration,
                        "EffectiveFrom"
                    );

                    const motRecord = getLatestRecord(
                        motHistory,
                        vehicle.Registration,
                        "TestDate"
                    );

                    return {
                        ...vehicle,
                        BaseLocation: baseRecord?.BaseLocation || "Unknown",
                        MotExpiry: motRecord?.ExpiryDate || "",
                        LatestMot: motRecord
                    };
                });
        }

        function calculateMotCounts(selectedBase) {
            const currentVehicles = buildCurrentVehicleData();

            const filteredVehicles = currentVehicles.filter(vehicle =>
                selectedBase === "All Bases" ||
                vehicle.BaseLocation === selectedBase
            );

            let overdue = 0;
            let upcoming = 0;

            filteredVehicles.forEach(vehicle => {
                if (
                    String(vehicle.LatestMot?.Result || "")
                        .trim()
                        .toLowerCase() === "fail"
                ) {
                    overdue++;
                    return;
                }

                const expiryDate =
                    parseDate(vehicle.MotExpiry);

                if (!expiryDate) {
                    return;
                }

                const daysRemaining =
                    daysBetween(new Date(), expiryDate);

                if (daysRemaining < 0) {
                    overdue++;
                } else if (
                    daysRemaining <= UPCOMING_DAYS
                ) {
                    upcoming++;
                }
            });

            return { overdue, upcoming };
        }

        function updateDashboard() {
            const selectedBase =
                document.getElementById("baseSelector").value;

            const counts = calculateMotCounts(selectedBase);

            document.getElementById("motOverdue").textContent =
                counts.overdue;

            document.getElementById("motUpcoming").textContent =
                counts.upcoming;

            document.getElementById("statusMessage").textContent =
                `Showing MOT exceptions for ${selectedBase}. ` +
                `Upcoming means due in the next ${UPCOMING_DAYS} days.`;
        }

        async function initialise() {
            const status = document.getElementById("statusMessage");

            try {
                [
                    vehicles,
                    baseLocations,
                    motHistory
                ] = await Promise.all([
                    loadCsv("data_Vehicles.csv",["Registration","FleetNumber","Make","Model","VehicleClass","Active"]),
                    loadCsv("data_BaseLocationLog.csv",["Registration","BaseLocation","EffectiveFrom"]),
                    loadCsv("data_MotLog.csv",["Registration","TestDate","Result","ExpiryDate","Advisories","TestCentre","RecordedAt","RecordedBy"])
                ]);

                updateDashboard();

                document
                    .getElementById("baseSelector")
                    .addEventListener("change", updateDashboard);

            } catch (error) {
                console.error(error);

                status.textContent =
                    error.message;

                status.classList.add("error");
            }
        }

        initialise();
    </script>
</body>
</html>
