<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Record MOT | FleetHub</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>

    <style>
        :root {
            --background: #1f2328;
            --panel: #2b3138;
            --border: #59616a;
            --text: #f5f7fa;
            --muted: #c5cad0;
            --accent: #4da3ff;
            --success: #45c486;
            --danger: #ff5c64;
        }

        body {
            background: var(--background);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            margin: 0;
        }

        .app-container {
            max-width: 760px;
            margin: 0 auto;
            padding: 22px 14px 50px;
        }

        .page-header {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .back-link {
            color: var(--muted);
            font-size: 1.5rem;
            text-decoration: none;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 650;
            margin: 0;
        }

        .form-panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .form-label {
            color: var(--muted);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            min-height: 48px;
            font-size: 1rem;
        }

        textarea.form-control {
            min-height: 110px;
        }

        .vehicle-results {
            background: white;
            border-radius: 0 0 7px 7px;
            color: #222;
            display: none;
            max-height: 260px;
            overflow-y: auto;
            position: absolute;
            width: 100%;
            z-index: 20;
        }

        .vehicle-result {
            border-bottom: 1px solid #ddd;
            cursor: pointer;
            padding: 11px 12px;
        }

        .vehicle-result:hover {
            background: #edf4fb;
        }

        .vehicle-search-wrapper {
            position: relative;
        }

        .selected-vehicle {
            background: #23282e;
            border: 1px solid var(--border);
            border-radius: 7px;
            display: none;
            margin-top: 9px;
            padding: 12px;
        }

        .preview {
            background: #22272d;
            border: 1px solid var(--border);
            border-radius: 8px;
            display: none;
            margin-top: 22px;
            padding: 16px;
        }

        .preview pre {
            color: var(--text);
            margin: 0;
            white-space: pre-wrap;
        }

        .status-message {
            margin-top: 16px;
        }

        .status-success {
            color: var(--success);
        }

        .status-error {
            color: var(--danger);
        }

        .btn-primary {
            min-height: 50px;
            font-size: 1.05rem;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <main class="app-container">

        <header class="page-header">
            <a class="back-link" href="index.html" aria-label="Back to FleetHub">←</a>
            <h1 class="page-title">Record completed MOT</h1>
        </header>

        <section class="form-panel">

            <form id="motForm">

                <div class="mb-3">
                    <label for="baseSelect" class="form-label">Base</label>

                    <select id="baseSelect" class="form-select" required>
                        <option value="">Select base</option>
                        <option value="All Bases">All Bases</option>
                        <option value="Canvey">Canvey</option>
                        <option value="Chelmsford">Chelmsford</option>
                        <option value="Southend">Southend</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="vehicleSearch" class="form-label">Vehicle</label>

                    <div class="vehicle-search-wrapper">
                        <input
                            id="vehicleSearch"
                            class="form-control"
                            type="search"
                            placeholder="Type registration, fleet number, make or model"
                            autocomplete="off"
                            disabled
                        >

                        <div id="vehicleResults" class="vehicle-results"></div>
                    </div>

                    <input id="selectedRegistration" type="hidden">

                    <div id="selectedVehicle" class="selected-vehicle"></div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="testDate" class="form-label">Test date</label>
                        <input id="testDate" class="form-control" type="date" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="result" class="form-label">Result</label>

                        <select id="result" class="form-select" required>
                            <option value="">Select result</option>
                            <option value="Pass">Pass</option>
                            <option value="Fail">Fail</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="expiryDate" class="form-label">New expiry date</label>

                    <input
                        id="expiryDate"
                        class="form-control"
                        type="date"
                        required
                    >

                    <div class="form-text text-light-emphasis">
                        Automatically suggested after selecting a test date and Pass.
                    </div>
                </div>

                <div class="mb-3">
                    <label for="testCentre" class="form-label">Approved MOT centre</label>

                    <select id="testCentre" class="form-select" required>
                        <option value="">Loading approved centres…</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="advisories" class="form-label">Advisories</label>

                    <textarea
                        id="advisories"
                        class="form-control"
                        placeholder="Enter advisories, or leave blank if none"
                    ></textarea>
                </div>

                <div class="mb-3">
                    <label for="recordedBy" class="form-label">Recorded by</label>

                    <input
                        id="recordedBy"
                        class="form-control"
                        type="text"
                        value="Demo Admin"
                        required
                    >
                </div>

                <button class="btn btn-primary w-100" type="submit">
                    Review MOT record
                </button>

            </form>

            <div id="preview" class="preview">
                <h2 class="h5">MOT record to be added</h2>

                <pre id="previewContent"></pre>

                <button id="confirmButton" class="btn btn-success w-100 mt-3">
                    Confirm and save
                </button>

                <button id="cancelButton" class="btn btn-outline-light w-100 mt-2">
                    Go back and edit
                </button>
            </div>

            <div id="statusMessage" class="status-message"></div>

        </section>
    </main>

    <script>
        const DATA_FILES = {
            vehicles: "data_Vehicles.csv",
            bases: "data_BaseLocationLog.csv",
            centres: "data_MotCentreLog.csv"
        };

        /*
         * Add the Cloudflare Worker address later.
         *
         * Example:
         * const WORKER_URL =
         *     "https://fleethub-api.your-account.workers.dev/add-mot";
         */

        let vehicles = [];
        let baseLocations = [];
        let currentVehicles = [];
        let pendingMotRecord = null;

        function loadCsv(filename) {
            return new Promise((resolve, reject) => {
                Papa.parse(filename, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,

                    complete(results) {
                        if (results.errors.length > 0) {
                            reject(results.errors);
                            return;
                        }

                        resolve(results.data);
                    },

                    error(error) {
                        reject(error);
                    }
                });
            });
        }

        function parseDate(value) {
            if (!value) return null;

            const [year, month, day] = value.split("-").map(Number);
            return new Date(year, month - 1, day);
        }

        function formatDateForInput(dateValue) {
            const year = dateValue.getFullYear();
            const month = String(dateValue.getMonth() + 1).padStart(2, "0");
            const day = String(dateValue.getDate()).padStart(2, "0");

            return `${year}-${month}-${day}`;
        }

        function getLatestBase(registration) {
            return baseLocations
                .filter(row => row.Registration === registration)
                .sort(
                    (a, b) =>
                        parseDate(b.EffectiveFrom) -
                        parseDate(a.EffectiveFrom)
                )[0] || null;
        }

        function buildCurrentVehicles() {
            currentVehicles = vehicles
                .filter(vehicle => vehicle.Active === "Yes")
                .map(vehicle => {
                    const base = getLatestBase(vehicle.Registration);

                    return {
                        ...vehicle,
                        BaseLocation: base?.BaseLocation || "Unknown"
                    };
                });
        }

        function getActiveCentres(centreRows) {
            const today = new Date();

            return centreRows.filter(centre => {
                const activeDate = parseDate(centre.ActiveDate);
                const inactiveDate = parseDate(centre.InactiveDate);

                return (
                    activeDate &&
                    activeDate <= today &&
                    (!inactiveDate || inactiveDate > today)
                );
            });
        }

        function populateCentres(centreRows) {
            const centreSelect = document.getElementById("testCentre");
            const activeCentres = getActiveCentres(centreRows);

            centreSelect.innerHTML =
                '<option value="">Select approved centre</option>';

            activeCentres
                .sort((a, b) => a.Name.localeCompare(b.Name))
                .forEach(centre => {
                    const option = document.createElement("option");

                    option.value = centre.Name;
                    option.textContent =
                        centre.Location
                            ? `${centre.Name} — ${centre.Location}`
                            : centre.Name;

                    centreSelect.appendChild(option);
                });
        }

        function clearVehicleSelection() {
            document.getElementById("selectedRegistration").value = "";
            document.getElementById("selectedVehicle").style.display = "none";
            document.getElementById("selectedVehicle").textContent = "";
        }

        function selectVehicle(vehicle) {
            document.getElementById("selectedRegistration").value =
                vehicle.Registration;

            document.getElementById("vehicleSearch").value =
                vehicle.Registration;

            const details = [
                vehicle.Registration,
                vehicle.FleetNumber,
                vehicle.BaseLocation,
                vehicle.Make,
                vehicle.Model,
                vehicle.VehicleClass
            ]
                .filter(Boolean)
                .join(" · ");

            const selectedPanel =
                document.getElementById("selectedVehicle");

            selectedPanel.textContent = details;
            selectedPanel.style.display = "block";

            document.getElementById("vehicleResults").style.display = "none";
        }

        function showVehicleResults() {
            const selectedBase =
                document.getElementById("baseSelect").value;

            const searchText =
                document
                    .getElementById("vehicleSearch")
                    .value
                    .trim()
                    .toLowerCase();

            const resultsPanel =
                document.getElementById("vehicleResults");

            if (!selectedBase) {
                resultsPanel.style.display = "none";
                return;
            }

            let filtered = currentVehicles.filter(vehicle =>
                selectedBase === "All Bases" ||
                vehicle.BaseLocation === selectedBase
            );

            if (searchText) {
                filtered = filtered.filter(vehicle => {
                    const searchableText = [
                        vehicle.Registration,
                        vehicle.FleetNumber,
                        vehicle.Make,
                        vehicle.Model,
                        vehicle.VehicleClass,
                        vehicle.BaseLocation
                    ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();

                    return searchableText.includes(searchText);
                });
            }

            filtered = filtered.slice(0, 30);

            resultsPanel.innerHTML = "";

            if (filtered.length === 0) {
                resultsPanel.innerHTML =
                    '<div class="vehicle-result">No matching vehicles</div>';
            } else {
                filtered.forEach(vehicle => {
                    const item = document.createElement("div");

                    item.className = "vehicle-result";
                    item.innerHTML = `
                        <strong>${vehicle.Registration}</strong>
                        <br>
                        <small>
                            ${vehicle.BaseLocation}
                            · ${vehicle.Make}
                            · ${vehicle.Model}
                            · ${vehicle.VehicleClass}
                        </small>
                    `;

                    item.addEventListener("click", () => {
                        selectVehicle(vehicle);
                    });

                    resultsPanel.appendChild(item);
                });
            }

            resultsPanel.style.display = "block";
        }

        function updateSuggestedExpiry() {
            const result = document.getElementById("result").value;
            const testDateValue =
                document.getElementById("testDate").value;

            const expiryInput =
                document.getElementById("expiryDate");

            if (result === "Fail") {
                expiryInput.value = "";
                expiryInput.disabled = true;
                expiryInput.required = false;
                return;
            }

            expiryInput.disabled = false;
            expiryInput.required = true;

            if (result !== "Pass" || !testDateValue) {
                return;
            }

            const testDate = parseDate(testDateValue);

            const suggestedExpiry = new Date(
                testDate.getFullYear() + 1,
                testDate.getMonth(),
                testDate.getDate()
            );

            suggestedExpiry.setDate(suggestedExpiry.getDate() - 1);

            expiryInput.value =
                formatDateForInput(suggestedExpiry);
        }

        function buildMotRecord() {
            const registration =
                document.getElementById("selectedRegistration").value;

            const result =
                document.getElementById("result").value;

            return {
                Registration: registration,
                TestDate: document.getElementById("testDate").value,
                Result: result,

                ExpiryDate:
                    result === "Pass"
                        ? document.getElementById("expiryDate").value
                        : "",

                Advisories:
                    document.getElementById("advisories").value.trim(),

                TestCentre:
                    document.getElementById("testCentre").value,

                RecordedAt: new Date().toISOString(),

                RecordedBy:
                    document.getElementById("recordedBy").value.trim()
            };
        }

        function validateMotRecord(record) {
            if (!record.Registration) {
                return "Select a vehicle.";
            }

            if (!record.TestDate) {
                return "Select the MOT test date.";
            }

            if (!record.Result) {
                return "Select Pass or Fail.";
            }

            if (record.Result === "Pass" && !record.ExpiryDate) {
                return "Select the new expiry date.";
            }

            if (!record.TestCentre) {
                return "Select an approved MOT centre.";
            }

            if (!record.RecordedBy) {
                return "Enter who recorded the MOT.";
            }

            return "";
        }

        function showPreview(record) {
            const csvLine = [
                record.Registration,
                record.TestDate,
                record.Result,
                record.ExpiryDate,
                record.Advisories || "",
                record.TestCentre,
                record.RecordedAt,
                record.RecordedBy
            ]
                .map(value => `"${String(value).replaceAll('"', '""')}"`)
                .join(",");

            document.getElementById("previewContent").textContent =
`Registration: ${record.Registration}
Test date: ${record.TestDate}
Result: ${record.Result}
New expiry: ${record.ExpiryDate || "Not applicable"}
Test centre: ${record.TestCentre}
Advisories: ${record.Advisories || "None"}
Recorded by: ${record.RecordedBy}

CSV row:
${csvLine}`;

            document.getElementById("motForm").style.display = "none";
            document.getElementById("preview").style.display = "block";
        }

        async function saveMotRecord(record) {
            const status =
                document.getElementById("statusMessage");

            status.className = "status-message";
            status.textContent =
                "Demo mode: the record is valid, but saving is not connected yet.";

            /*
             * CLOUDFARE WORKER UPDATE CODE
             *
             * Uncomment this when the Worker has been deployed.
             *
             * try {
             *     status.textContent = "Saving MOT record…";
             *
             *     const response = await fetch(WORKER_URL, {
             *         method: "POST",
             *         headers: {
             *             "Content-Type": "application/json"
             *         },
             *         body: JSON.stringify(record)
             *     });
             *
             *     const result = await response.json();
             *
             *     if (!response.ok) {
             *         throw new Error(
             *             result.error || "The MOT record could not be saved."
             *         );
             *     }
             *
             *     status.className =
             *         "status-message status-success";
             *
             *     status.textContent =
             *         `${record.Registration} MOT saved successfully.`;
             *
             *     setTimeout(() => {
             *         window.location.href = "index.html";
             *     }, 1500);
             *
             * } catch (error) {
             *     console.error(error);
             *
             *     status.className =
             *         "status-message status-error";
             *
             *     status.textContent = error.message;
             * }
             */
        }

        async function initialise() {
            const status =
                document.getElementById("statusMessage");

            try {
                const [
                    vehicleRows,
                    baseRows,
                    centreRows
                ] = await Promise.all([
                    loadCsv(DATA_FILES.vehicles),
                    loadCsv(DATA_FILES.bases),
                    loadCsv(DATA_FILES.centres)
                ]);

                vehicles = vehicleRows;
                baseLocations = baseRows;

                buildCurrentVehicles();
                populateCentres(centreRows);

                status.textContent = "";

            } catch (error) {
                console.error(error);

                status.className =
                    "status-message status-error";

                status.textContent =
                    "Could not load the FleetHub data files.";
            }
        }

        document
            .getElementById("baseSelect")
            .addEventListener("change", event => {
                const vehicleSearch =
                    document.getElementById("vehicleSearch");

                clearVehicleSelection();

                vehicleSearch.value = "";
                vehicleSearch.disabled = !event.target.value;

                document.getElementById("vehicleResults").style.display =
                    "none";
            });

        document
            .getElementById("vehicleSearch")
            .addEventListener("input", () => {
                clearVehicleSelection();
                showVehicleResults();
            });

        document
            .getElementById("vehicleSearch")
            .addEventListener("focus", showVehicleResults);

        document
            .getElementById("testDate")
            .addEventListener("change", updateSuggestedExpiry);

        document
            .getElementById("result")
            .addEventListener("change", updateSuggestedExpiry);

        document
            .getElementById("motForm")
            .addEventListener("submit", event => {
                event.preventDefault();

                const record = buildMotRecord();
                const error = validateMotRecord(record);

                const status =
                    document.getElementById("statusMessage");

                if (error) {
                    status.className =
                        "status-message status-error";

                    status.textContent = error;
                    return;
                }

                status.textContent = "";
                pendingMotRecord = record;
                showPreview(record);
            });

        document
            .getElementById("cancelButton")
            .addEventListener("click", () => {
                document.getElementById("preview").style.display = "none";
                document.getElementById("motForm").style.display = "block";
                document.getElementById("statusMessage").textContent = "";
            });

        document
            .getElementById("confirmButton")
            .addEventListener("click", () => {
                if (pendingMotRecord) {
                    saveMotRecord(pendingMotRecord);
                }
            });

        document.addEventListener("click", event => {
            const wrapper =
                document.querySelector(".vehicle-search-wrapper");

            if (!wrapper.contains(event.target)) {
                document.getElementById("vehicleResults").style.display =
                    "none";
            }
        });

        initialise();
    </script>
</body>
</html>
