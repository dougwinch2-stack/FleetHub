<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FleetHub</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#1f2328;
    color:white;
    padding:15px;
    font-family:Segoe UI,Arial,sans-serif;
}

.title{
    font-size:2rem;
    font-weight:600;
    margin-bottom:20px;
}

.card{
    background:#2b3138;
    color:white;
    border:1px solid #555;
}

.kpi{
    text-align:center;
    font-size:2.5rem;
    font-weight:bold;
}

.red{
    color:#ff5555;
}

.amber{
    color:#ffc107;
}

.smalltext{
    color:#cccccc;
    font-size:0.9rem;
}

</style>

</head>

<body>

<div class="container">

<div class="title">
FleetHub
</div>

<div class="mb-4">

<select class="form-select">

<option>All Bases</option>
<option>Canvey</option>
<option>Chelmsford</option>
<option>Southend</option>

</select>

</div>

<div class="row">

<div class="col-6">

<div class="card">

<div class="card-body">

<div class="smalltext">
OVERDUE
</div>

<div id="overdue" class="kpi red">
--
</div>

</div>

</div>

</div>

<div class="col-6">

<div class="card">

<div class="card-body">

<div class="smalltext">
DUE IN 30 DAYS
</div>

<div id="pending" class="kpi amber">
--
</div>

</div>

</div>

</div>

</div>

<hr>

<h3>MOT Exceptions</h3>

<div id="status">

Loading...

</div>

</div>

<script>

document.getElementById("status").innerHTML =
"FleetHub is running successfully.";

</script>

</body>

</html>
